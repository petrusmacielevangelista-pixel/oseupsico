<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento confirmado · O Seu Psico</title>
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Google tag (gtag.js) — GA4 + Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5BVMLRQGZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5BVMLRQGZ3');
    gtag('config', 'AW-18384131981');
  </script>
</head>
<body>
  <section class="osp-hero" style="min-height:80vh;display:flex;align-items:center;border-bottom:none;">
    <div class="container" style="max-width:480px;">
      <div class="osp-card" style="text-align:center;">
        <div id="ok-view" class="hidden">
          <div style="font-size:2.5rem;margin-bottom:16px;">✅</div>
          <h1 style="font-family:var(--font-display);color:#1A1A1A;font-size:1.6rem;margin-bottom:12px;">Agendamento confirmado!</h1>
          <p>Seu horário está reservado. Enviamos os detalhes pro seu e-mail.</p>
        </div>
        <div id="erro-view" class="hidden">
          <div style="font-size:2.5rem;margin-bottom:16px;">⚠️</div>
          <h1 style="font-family:var(--font-display);color:#1A1A1A;font-size:1.6rem;margin-bottom:12px;">Link inválido ou expirado</h1>
          <p>Esse link de confirmação já foi usado, expirou, ou o horário não está mais disponível.</p>
        </div>
        <a href="/psicologos/" class="btn btn--yellow btn--lg" style="margin-top:24px;display:inline-flex;">Ver psicólogos →</a>
      </div>
    </div>
  </section>
  <script>
    const ok = new URLSearchParams(location.search).get('ok') === '1';
    document.getElementById(ok ? 'ok-view' : 'erro-view').classList.remove('hidden');
  </script>
</body>
</html>

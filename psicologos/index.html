<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encontre seu psicólogo · O Seu Psico</title>
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar navbar--interna">
    <div class="container">
      <div class="navbar__inner">
        <a href="/" class="navbar__logo">
          <img src="/assets/logo.png" alt="O Seu Psico" class="navbar__logo-img" />
          <span class="navbar__logo-text">O Seu Psico</span>
        </a>
        <a href="/psicologos/cadastro.html" class="navbar__back">Sou psicólogo →</a>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h1 style="font-family:var(--font-display);font-size:2rem;margin-bottom:8px;">Encontre seu psicólogo</h1>
      <p style="color:#666;margin-bottom:32px;">Profissionais verificados, prontos pra te acompanhar.</p>

      <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;">
        <p>Carregando...</p>
      </div>
    </div>
  </section>

  <script>
    async function carregar() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/psicologos');
        const data = await res.json();
        const lista = data.psicologos || [];
        if (!lista.length) { grid.innerHTML = '<p>Nenhum psicólogo disponível no momento.</p>'; return; }

        grid.innerHTML = lista.map(p => {
          const especialidades = JSON.parse(p.especialidades || '[]');
          const badge5anos = p.anos_experiencia >= 5
            ? `<div style="background:#FFF8DC;color:#7a6200;font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:8px;">🏅 +5 anos de experiência</div>`
            : '';
          return `
            <a href="/psicologos/perfil.html?id=${p.id}" style="text-decoration:none;color:inherit;background:#fff;border:1.5px solid #eee;border-radius:16px;padding:20px;display:block;transition:border-color .2s;">
              <div style="width:72px;height:72px;border-radius:50%;background:#F7F5F0;overflow:hidden;margin-bottom:12px;">
                ${p.foto_url ? `<img src="${p.foto_url}" style="width:100%;height:100%;object-fit:cover;" />` : ''}
              </div>
              ${badge5anos}
              <div style="font-weight:700;font-size:1.05rem;margin-bottom:4px;">${p.nome}</div>
              <div style="font-size:0.85rem;color:#888;margin-bottom:8px;">${p.graduacao_curso || ''}</div>
              <div style="font-size:0.8rem;color:#666;">${especialidades.slice(0, 3).join(' · ')}</div>
            </a>
          `;
        }).join('');
      } catch {
        grid.innerHTML = '<p>Erro ao carregar psicólogos.</p>';
      }
    }
    carregar();
  </script>
</body>
</html>
